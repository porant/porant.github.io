<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porant — Portfolio</title>

    <link rel="stylesheet" href="style.css">

    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="manifest" href="icons/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Sofia+Sans+Semi+Condensed:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
    <script defer src="https://litics.porant.de/script.js" data-website-id="e810b1bf-a3e0-4340-a0ff-8105e79ffcee"></script>
</head>

<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="#" class="logo">PORANT</a>
            <nav class="nav">
                <a href="#anims">Animations</a>
                <a href="#projects">Projects</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Hero-блок с 3D-кубом -->
        <section class="hero">
            <div class="spinner-wrapper">
                <div class="spinner">
                    <div>PT</div>
                    <div>PT</div>
                    <div>PT</div>
                    <div>PT</div>
                    <div>PT</div>
                    <div>PT</div>
                </div>
            </div>
            <h1 class="hero-title">Porant</h1>
            <p class="hero-subtitle">Motion Designer &amp; Animator</p>
        </section>

        <!-- Анимации -->
        <section id="anims" class="section">
            <h2 class="section-title">Animations</h2>
            <div class="grid">
                <article class="card">
                    <div class="media-wrap">
                        <video loop autoplay muted playsinline>
                            <source src="anims/BlackCat.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="card-info">
                        <h3>BlackCat</h3>
                        <span class="tag">Animation</span>
                    </div>
                </article>

                <article class="card">
                    <div class="media-wrap">
                        <video loop autoplay muted playsinline>
                            <source src="anims/MI BG.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="card-info">
                        <h3>MI — Background</h3>
                        <span class="tag">Loop</span>
                    </div>
                </article>

                <article class="card">
                    <div class="media-wrap">
                        <video loop autoplay muted playsinline>
                            <source src="anims/STINGER.mp4" type="video/mp4">
                        </video>
                    </div>
                    <div class="card-info">
                        <h3>MI — Stinger</h3>
                        <span class="tag">Transition</span>
                    </div>
                </article>
            </div>
        </section>

        <!-- Небольшие проекты -->
        <section id="projects" class="section">
            <h2 class="section-title">Small Projects</h2>
            <div class="grid grid-small">
                <article class="card">
                    <div class="emotes-showcase">
                        <div class="emote-box">
                            <img class="emote" src="anims/Booba.gif" alt="MagicMaid Booba emote">
                        </div>
                        <div class="emote-box">
                            <img class="emote" src="anims/HypeAnim.gif" alt="MagicMaid Hype emote">
                        </div>
                    </div>
                    <div class="card-info">
                        <h3>MagicMaid's Emotes</h3>
                        <span class="tag">GIF / Emotes</span>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© Porant</p>
    </footer>
</body>

</html>
